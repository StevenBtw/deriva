# typos configuration
# https://github.com/crate-ci/typos

[files]
extend-exclude = [
    ".venv/",
    "*.lock",
    "workspace/",
    "deriva/adapters/archimate/archimate_xsd/",
    ".pytest_cache/",
    ".ruff_cache/",
    "*.db",
]

[default.extend-words]
# ArchiMate element ID prefixes (ba_ = BusinessActor, nd_ = Node)
ba = "ba"
nd = "nd"
# JCL keyword (EXEC PGM=..., PARM=...)
parm = "parm"
# COBOL copybook extension (.cpy)
cpy = "cpy"
# Author surname (Nast et al., BIS 2026: the design baseline B1 follows)
nast = "nast"
# Technology names in the seed configuration (Eclipse Mosquitto broker, TestNG framework)
mosquitto = "mosquitto"
testng = "testng"

[default.extend-identifiers]
# Lemmatizer suffix-stripping results (intentional truncated forms)
continu = "continu"
processe = "processe"
ment = "ment"
ful = "ful"
