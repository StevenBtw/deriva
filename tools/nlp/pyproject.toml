[project]
name = "deriva-nlp"
version = "0.1.0"
description = "Deterministic multilingual term extraction for Deriva: candidate terms and their English canonical forms from documentation."
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0" }
dependencies = [
    "spacy==3.8.7",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "de-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl",
    "fr-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/fr_core_news_sm-3.8.0/fr_core_news_sm-3.8.0-py3-none-any.whl",
    "ctranslate2==4.6.0",
    "sentencepiece==0.2.0",
    # ctranslate2 still imports pkg_resources
    "setuptools==75.8.0",
    "click==8.1.8",
]

[project.scripts]
deriva-nlp = "deriva_nlp.cli:main"

[tool.uv]
dev-dependencies = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deriva_nlp"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["models: needs the spaCy and translation models (deriva-nlp models)"]
