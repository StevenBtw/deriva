[project]
name = "deriva-cli"
version = "0.7.1"
description = "Deriva is a research project aimed at enabling digital architects by automating the derivation of enterprise architecture models. Deriva uses dual knowledge graphs, heuristics and LLM's."
# The PyPI page; README.md is the repository's own
readme = "packages/README-deriva-cli.md"
requires-python = ">=3.14"
authors = [
    { name = "S. T. Grond", email = "steven@deriva.dev" }
]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = [
    "archimate",
    "enterprise-architecture",
    "code-analysis",
    "llm",
    "grafeo",
    "fastapi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

dependencies = [
    # Core
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-dotenv>=1.2",
    "pyyaml>=6.0",
    "rich>=15",
    "lxml>=6",
    # Databases
    "duckdb>=1.5",
    "grafeo>=0.5.44",
    "sqlglot>=30",
    # Code Analysis (tree-sitter)
    "tree-sitter>=0.26",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-c-sharp>=0.23",
    # Document Parsing
    "pypdf>=6",
    "python-docx>=1.2",
    # NLP (business concept candidate terms; pinned, the versions decide the output; the spaCy pipelines download on first use)
    "spacy==3.8.16",
    "ctranslate2==4.8.2",
    "sentencepiece==0.2.2",
    # Graph Algorithms
    "solvor>=0.6.3",
    # LLM
    "backoff>=2.2.1",
    "pydantic-ai>=2",
    # Utilities
    "authlib>=1.8.0",
    # CVE-2026-27962, CVE-2026-28490 fix (transitive via fastmcp)
    "pyasn1>=0.6.4",
    # CVE-2026-30922 fix (transitive via google-auth/rsa)
    "pyjwt>=2.15",
    # CVE-2026-32597 fix (transitive via mcp)
    "diskcache>=5.6.3",
    "nest-asyncio>=1.6.0",
    "structlog>=26.1.0",
    "typer>=0.27",
    "httpx>=0.28.1",
    "pydantic-ai-slim[mistral]>=2",
]

[dependency-groups]
dev = [
    "deriva-dev",
    "pip-audit>=2",
    "prek>=0.5",
    "pytest>=9",
    "pytest-cov>=7",
    "ruff>=0.16",
    "ty>=0.0",
    "types-lxml>=2026.2",
]

[project.urls]
Homepage = "https://deriva.dev"
Documentation = "https://docs.deriva.dev"
Repository = "https://github.com/StevenBtw/deriva"
Issues = "https://github.com/StevenBtw/deriva/issues"
Changelog = "https://github.com/StevenBtw/deriva/blob/main/CHANGELOG.md"

[project.scripts]
deriva-cli = "deriva.cli.cli:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

# deriva is a namespace shared by three packages; this one holds the pipeline and the CLI
[tool.uv.build-backend]
module-root = ""
# deriva.adapters is itself a namespace (no __init__.py), so its subpackages are listed one by one
module-name = [
    "deriva.adapters.archimate",
    "deriva.adapters.database",
    "deriva.adapters.grafeo",
    "deriva.adapters.graph",
    "deriva.adapters.llm",
    "deriva.adapters.nlp",
    "deriva.adapters.repository",
    "deriva.adapters.treesitter",
    "deriva.cli",
    "deriva.common",
    "deriva.modules",
    "deriva.services",
]
source-exclude = [".mypy_cache", ".ruff_cache", "sql.db*", "ruff.toml"]

[tool.uv.workspace]
members = ["packages/*"]

# ============================================================================
# Tool Configuration
# ============================================================================

[tool.uv.sources]
# grafeo 0.6.0 development build (native graph metrics); back to PyPI when 0.6.0 is released
grafeo = { path = "H:/GrafeoDB/wheels/0.6.0-dev-ff9cca65/grafeo-0.5.44-cp312-abi3-win_amd64.whl" }
# The three packages of this repository (the root is deriva-cli)
deriva-cli = { workspace = true }
deriva-dev = { workspace = true }
deriva-studio = { workspace = true }

[tool.ruff]
line-length = 180
# deriva has no __init__.py (a namespace shared by three packages); this keeps it first-party for import sorting
namespace-packages = ["deriva", "packages/deriva-dev/src/deriva", "packages/deriva-studio/src/deriva"]
# The source roots of the three packages (first-party detection inside the shared namespace)
src = [".", "packages/deriva-dev/src", "packages/deriva-studio/src"]
target-version = "py314"
# Markdown code blocks are documentation examples, formatted by hand
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "FA",     # flake8-future-annotations
    "Q",      # flake8-quotes
    "TID251", # banned-api - architectural boundary enforcement
]
ignore = [
    "E402",  # Module level import not at top - needed for conditional imports
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
docstring-quotes = "double"

# =============================================================================
# Architectural Boundaries (Enforced by Ruff TID251)
# =============================================================================
# Layer hierarchy (top to bottom):
#   CLI      → can import: services ONLY (PipelineSession is the API)
#   App      → can import: services ONLY (PipelineSession is the API)
#   Services → can import: adapters, modules, common
#   Adapters → can import: common only (NOT modules or services)
#   Modules  → can import: common only (NOT adapters or services)
#   Common   → can import: stdlib and third-party only
#
# Per-layer restrictions are defined in:
#   - deriva/cli/ruff.toml
#   - deriva/common/ruff.toml
#   - deriva/adapters/ruff.toml
#   - deriva/modules/ruff.toml
# =============================================================================

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# CLI should never be imported by any layer (it's a top-level entry point)
"deriva.cli" = { msg = "Architecture violation: cli is a top-level entry point and should not be imported" }
"deriva.bench" = { msg = "Architecture violation: only the CLI and studio entry points load deriva.bench, behind about.features()" }
# Note: Layer-specific bans (adapters↔modules, etc.) are in per-directory ruff.toml files

[tool.ruff.lint.per-file-ignores]
# Tests can import from any layer for testing purposes
"tests/**/*.py" = ["E402", "TID251"]
# Files with long strings (SQL, LLM prompts)
"deriva/modules/validation/__init__.py" = ["E402"]
"deriva/modules/derivation/__init__.py" = ["E402"]
"deriva/adapters/database/export_current_db.py" = ["E501"]
"deriva/modules/extraction/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v -m 'not integration'"
markers = [
    "integration: integration tests (run locally with -m integration)",
]

[tool.coverage.run]
source = ["deriva/adapters", "deriva/modules", "deriva/common", "deriva/services", "deriva/cli", "packages/deriva-studio/src/deriva/studio", "packages/deriva-dev/src/deriva/bench"]
omit = [
    "*/__init__.py",
    "*/tests/*",
    # Graph database adapters
    "deriva/adapters/grafeo/*",
    "deriva/adapters/graph/*",
    "deriva/adapters/database/*",
    "deriva/adapters/archimate/*",
    # Refine steps requiring graph infrastructure
    "deriva/modules/derivation/refine/graph_relationships.py",
    # Benchmarking service (requires LLMs/databases for full testing)
    "packages/deriva-dev/src/deriva/bench/benchmarking.py",
    # Analysis modules (cross-repo, semantic matching) - require full pipeline integration
    "packages/deriva-dev/src/deriva/bench/analysis.py",
    "deriva/modules/analysis/cross_repo_analysis.py",
    "deriva/modules/analysis/semantic_matching.py",
]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ty.environment]
python-version = "3.14"
