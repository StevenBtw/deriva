[project]
name = "deriva-cli"
version = "0.8.2"
description = "Deriva is a research project aimed at enabling digital architects by automating the derivation of enterprise architecture models. Deriva uses dual knowledge graphs, heuristics and LLM's."
# The PyPI page; README.md is the repository's own
readme = "packages/README-deriva-cli.md"
requires-python = ">=3.14"
authors = [
    { name = "S. T. Grond", email = "steven@deriva.dev" }
]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = [
    "archimate",
    "enterprise-architecture",
    "code-analysis",
    "llm",
    "grafeo",
    "fastapi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

dependencies = [
    # Core
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-dotenv>=1.2",
    "pyyaml>=6.0",
    "rich>=15",
    "lxml>=6",
    # Databases
    "duckdb>=1.5",
    "grafeo>=0.6.0b1",
    # Code Analysis (tree-sitter)
    "tree-sitter>=0.26",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-c-sharp>=0.23",
    # Document Parsing
    "pypdf>=6",
    "python-docx>=1.2",
    # NLP (business concept candidate terms; pinned, the versions decide the output; the spaCy pipelines download on first use)
    "spacy==3.8.16",
    "ctranslate2==4.8.3",
    "sentencepiece==0.2.2",
    # Graph Algorithms
    "solvor>=0.6.3",
    # LLM
    # CVE-2026-107286, CVE-2026-107287 fixed in 2.53; slim with only the providers model_registry.py
    # builds (azure, ollama, lmstudio and mistral go through the openai client), so no google, logfire or mcp stack
    "pydantic-ai-slim[openai,anthropic]>=2.55",
    # Utilities
    "httpx2>=2.13",
    "lmdb>=1.6",
    "typer>=0.27",
    "tree-sitter-typescript==0.23.2",
]

[dependency-groups]
dev = [
    "deriva-dev",
    "pip-audit>=2",
    "prek>=0.5",
    "pytest>=9",
    "pytest-cov>=7",
    "ruff>=0.17",
    "ty>=0.0",
    "types-lxml>=2026.2",
]

[project.urls]
Homepage = "https://deriva.dev"
Documentation = "https://docs.deriva.dev"
Repository = "https://github.com/StevenBtw/deriva"
Issues = "https://github.com/StevenBtw/deriva/issues"
Changelog = "https://github.com/StevenBtw/deriva/blob/main/CHANGELOG.md"

[project.scripts]
deriva-cli = "deriva.cli.cli:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.14"]
build-backend = "uv_build"

# deriva is a namespace shared by three packages; this one holds the pipeline and the CLI
[tool.uv.build-backend]
module-root = ""
# deriva.adapters is itself a namespace (no __init__.py), so its subpackages are listed one by one
module-name = [
    "deriva.adapters.archimate",
    "deriva.adapters.database",
    "deriva.adapters.grafeo",
    "deriva.adapters.graph",
    "deriva.adapters.llm",
    "deriva.adapters.nlp",
    "deriva.adapters.repository",
    "deriva.adapters.treesitter",
    "deriva.cli",
    "deriva.common",
    "deriva.modules",
    "deriva.services",
]
source-exclude = [".mypy_cache", ".ruff_cache", "sql.db*", "ruff.toml"]

[tool.uv.workspace]
members = ["packages/*"]

# ============================================================================
# Tool Configuration
# ============================================================================

[tool.uv.sources]
# The three packages of this repository (the root is deriva-cli)
deriva-cli = { workspace = true }
deriva-dev = { workspace = true }
deriva-studio = { workspace = true }

[tool.ruff]
line-length = 180
# deriva has no __init__.py (a namespace shared by three packages); this keeps it first-party for import sorting
namespace-packages = ["deriva", "packages/deriva-dev/src/deriva", "packages/deriva-studio/src/deriva"]
# The source roots of the three packages (first-party detection inside the shared namespace)
src = [".", "packages/deriva-dev/src", "packages/deriva-studio/src"]
target-version = "py314"
# Markdown code blocks are documentation examples, formatted by hand
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "FA",     # flake8-future-annotations
    "Q",      # flake8-quotes
    "TID251", # banned-api - architectural boundary enforcement
]
ignore = [
    "E402",  # Module level import not at top - needed for conditional imports
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
docstring-quotes = "double"

# =============================================================================
# Architectural Boundaries (Enforced by Ruff TID251)
# =============================================================================
# Layer hierarchy (top to bottom):
#   CLI      → can import: services ONLY (PipelineSession is the API)
#   App      → can import: services ONLY (PipelineSession is the API)
#   Services → can import: adapters, modules, common
#   Adapters → can import: common only (NOT modules or services)
#   Modules  → can import: common only (NOT adapters or services)
#   Common   → can import: stdlib and third-party only
#
# Per-layer restrictions are defined in:
#   - deriva/cli/ruff.toml
#   - deriva/common/ruff.toml
#   - deriva/adapters/ruff.toml
#   - deriva/modules/ruff.toml
# =============================================================================

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# CLI should never be imported by any layer (it's a top-level entry point)
"deriva.cli" = { msg = "Architecture violation: cli is a top-level entry point and should not be imported" }
"deriva.bench" = { msg = "Architecture violation: only the CLI and studio entry points load deriva.bench, behind about.features()" }
# Note: Layer-specific bans (adapters↔modules, etc.) are in per-directory ruff.toml files

# Third-party libraries, enforced with the same rule. Each library is used where its package declares it:
#   - not at all: transitive packages no Deriva package declares, and the widgets' notebook stack
#   - adapters only: the heavy engines behind an adapter (LLM, NLP, databases, parsers)
#   - studio and bench only: the web stack, which deriva-cli does not install
# This table is inherited by every per-directory ruff.toml that does not set its own (their banned-api
# tables replace the one above, this one stays); deriva/adapters/ruff.toml and the studio and bench
# ruff.toml files set their own to allow the libraries of their layer
[tool.ruff.lint.flake8-tidy-imports.extend-banned-api]
# Not declared by any Deriva package
"requests" = { msg = "Not a dependency of Deriva (only installed through other packages); use httpx2" }
"httpx" = { msg = "Not a direct dependency of Deriva (only installed through other packages); Deriva's HTTP client is httpx2, the client pydantic-ai and the provider SDKs run on" }
"anywidget" = { msg = "The studio serves the widgets' front end only (anywidget_graph.ui, anywidget_archimate.ui)" }
"ipywidgets" = { msg = "The studio serves the widgets' front end only (anywidget_graph.ui, anywidget_archimate.ui)" }
"marimo" = { msg = "Not a dependency of Deriva (the marimo app was replaced by the studio)" }
# Adapters only
"pydantic_ai" = { msg = "Library boundary: LLM calls go through deriva.adapters.llm" }
"spacy" = { msg = "Library boundary: NLP goes through deriva.adapters.nlp" }
"ctranslate2" = { msg = "Library boundary: NLP goes through deriva.adapters.nlp" }
"sentencepiece" = { msg = "Library boundary: NLP goes through deriva.adapters.nlp" }
"duckdb" = { msg = "Library boundary: the config database goes through deriva.adapters.database" }
"grafeo" = { msg = "Library boundary: the graphs go through deriva.adapters.grafeo" }
"lxml" = { msg = "Library boundary: ArchiMate XML goes through deriva.adapters.archimate" }
"tree_sitter" = { msg = "Library boundary: parsing goes through deriva.adapters.treesitter" }
# Studio and bench only (deriva-studio and deriva-dev declare them, deriva-cli does not)
"fastapi" = { msg = "Not a dependency of deriva-cli: web code lives in deriva-studio (deriva.studio) or deriva-dev (deriva.bench)" }
"starlette" = { msg = "Not a dependency of deriva-cli: web code lives in deriva-studio (deriva.studio) or deriva-dev (deriva.bench)" }
"uvicorn" = { msg = "Not a dependency of deriva-cli: web code lives in deriva-studio (deriva.studio) or deriva-dev (deriva.bench)" }
"anywidget_graph" = { msg = "Not a dependency of deriva-cli: the widgets are served by deriva-studio (deriva.studio)" }
"anywidget_archimate" = { msg = "Not a dependency of deriva-cli: the widgets are served by deriva-studio (deriva.studio)" }

[tool.ruff.lint.per-file-ignores]
# Tests can import from any layer for testing purposes
"tests/**/*.py" = ["E402", "TID251"]
# Files with long strings (SQL, LLM prompts)
"deriva/modules/validation/__init__.py" = ["E402"]
"deriva/modules/derivation/__init__.py" = ["E402"]
"deriva/adapters/database/export_current_db.py" = ["E501"]
"deriva/modules/extraction/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v -m 'not integration'"
markers = [
    "integration: integration tests (run locally with -m integration)",
]

[tool.coverage.run]
source = ["deriva/adapters", "deriva/modules", "deriva/common", "deriva/services", "deriva/cli", "packages/deriva-studio/src/deriva/studio", "packages/deriva-dev/src/deriva/bench"]
omit = [
    "*/__init__.py",
    "*/tests/*",
    # Graph database adapters
    "deriva/adapters/grafeo/*",
    "deriva/adapters/graph/*",
    "deriva/adapters/database/*",
    "deriva/adapters/archimate/*",
    # Refine steps requiring graph infrastructure
    "deriva/modules/derivation/refine/graph_relationships.py",
    # Benchmarking service (requires LLMs/databases for full testing)
    "packages/deriva-dev/src/deriva/bench/benchmarking.py",
    # Analysis modules (cross-repo, semantic matching) - require full pipeline integration
    "packages/deriva-dev/src/deriva/bench/analysis.py",
    "deriva/modules/analysis/cross_repo_analysis.py",
    "deriva/modules/analysis/semantic_matching.py",
]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ty.environment]
python-version = "3.14"
