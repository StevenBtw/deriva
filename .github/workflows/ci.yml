name: CI

on:
  push:
    branches: [main, dev, "release/*"]
  pull_request:
    branches: [main, dev]

env:
  PYTHON_VERSION: "3.14"

# Every job only reads the repository
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff linter
        run: uv run ruff check .

      - name: Run Ruff formatter check
        run: uv run ruff format --check deriva/ packages/

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for typos
        uses: crate-ci/typos@685eb3d55be2f85191e8c84acb9f44d7756f84ab # v1.29.4

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Run ty type checker
        run: uv run ty check .
        env:
          PYTHONPATH: src

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest --cov --cov-report=xml --cov-fail-under=80 -v -m "not integration"

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  frontend:
    name: Studio front end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # The three packages build, install as uv tools and run on every platform
  packages:
    name: Packages (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Build the studio front end
        working-directory: studio
        run: npm ci && npm run build

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"

      - name: Build the three packages
        run: uv build --all-packages --no-sources -o dist

      - name: The studio wheel holds the built front end
        shell: bash
        run: uv run --no-project python -m zipfile -l dist/deriva_studio-*.whl | grep -q "deriva/studio/static/index.html"

      # GITHUB_PATH takes the platform's path form (an export inside Git Bash would not)
      - name: Put the tool folder on PATH
        shell: bash
        run: echo "${{ runner.temp }}/bin" >> "$GITHUB_PATH"

      - name: Install each package as a tool and smoke test it
        shell: bash
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/bin
          DERIVA_HOME: ${{ runner.temp }}/home
        run: |
          # Every workspace wheel by path: uv would reuse a cached build of the same version otherwise
          uv tool install --python 3.14 dist/deriva_studio-*.whl --with dist/deriva_cli-*.whl
          deriva-cli --help
          deriva-cli status
          status=0
          output="$(deriva-cli benchmark run --repos x --models m 2>&1)" || status=$?
          if [[ $status -eq 0 || "$output" != *"Benchmarking is part of deriva-dev"* ]]; then echo "benchmark must be missing in deriva-studio: $output"; exit 1; fi
          uv tool uninstall deriva-studio
          uv tool install --python 3.14 dist/deriva_dev-*.whl --with dist/deriva_studio-*.whl --with dist/deriva_cli-*.whl
          deriva-cli benchmark --help

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Audit dependencies
        run: uv run pip-audit --skip-editable --ignore-vuln CVE-2025-69872  # skip the project itself (not on PyPI); diskcache pickle CVE: Deriva's JSONOnlyDisk refuses pickled rows
