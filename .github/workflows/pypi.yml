name: Publish to PyPI

# A version tag publishes all three packages (deriva-cli, deriva-studio, deriva-dev) at that version
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"

# Building, publishing and the release asset are separate jobs, each with only the permission it needs
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: The tag equals the version of all three packages and their pins
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for project in . packages/deriva-studio packages/deriva-dev; do
            version=$(uv version --short --project "$project")
            [ "$version" = "$tag" ] || { echo "$project is $version, tag is $tag"; exit 1; }
          done
          grep -q "\"deriva-cli==$tag\"" packages/deriva-studio/pyproject.toml || { echo "deriva-studio must pin deriva-cli==$tag"; exit 1; }
          grep -q "\"deriva-studio==$tag\"" packages/deriva-dev/pyproject.toml || { echo "deriva-dev must pin deriva-studio==$tag"; exit 1; }

      - name: Build the studio front end
        working-directory: studio
        run: npm ci && npm run build

      - name: Build
        run: uv build --all-packages --no-sources -o dist

      - name: Smoke test the wheels and the source distributions
        shell: bash
        env:
          DERIVA_HOME: ${{ runner.temp }}/home
        run: |
          version="${GITHUB_REF_NAME#v}"
          smoke() {
            uv run --isolated --no-project --python 3.14 \
              --with "$1/deriva_cli-$version-py3-none-any.whl" \
              --with "$1/deriva_studio-$version-py3-none-any.whl" \
              --with "$1/deriva_dev-$version-py3-none-any.whl" \
              -- deriva-cli benchmark --help > /dev/null
          }
          smoke dist
          for sdist in dist/*.tar.gz; do uv build --no-sources --wheel -o "$RUNNER_TEMP/rebuilt" "$sdist"; done
          smoke "$RUNNER_TEMP/rebuilt"
          unzip -l "$RUNNER_TEMP/rebuilt/deriva_studio-$version-py3-none-any.whl" | grep -q "deriva/studio/static/index.html"

      # Attached to the GitHub release: uv tool install deriva-dev==<version> -c constraints.txt
      - name: Pinned environment of this release
        run: uv export --locked --all-packages --no-dev --no-hashes --no-emit-workspace -o constraints.txt

      - name: Upload the distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

      - name: Upload the constraints
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: constraints
          path: constraints.txt

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Download the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      # Trusted publishing: no stored credentials
      - name: Publish
        run: uv publish

  release-asset:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the constraints
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: constraints

      - name: Attach constraints.txt to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" constraints.txt --repo "$GITHUB_REPOSITORY" --generate-notes || gh release upload "$GITHUB_REF_NAME" constraints.txt --repo "$GITHUB_REPOSITORY" --clobber
