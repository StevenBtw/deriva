# Benchmarking (deriva-dev): services-level code, one CLI command module and one studio router.
# Only the two entry modules may reach into the CLI and the studio.
extend = "../../../../../pyproject.toml"

[lint.flake8-tidy-imports.banned-api]
"deriva.cli" = { msg = "Architecture violation: only deriva/bench/cli.py (the benchmark command) imports the CLI" }
"deriva.studio" = { msg = "Architecture violation: only deriva/bench/router.py (the benchmark API) imports the studio" }

[lint.per-file-ignores]
"cli.py" = ["TID251"]
"router.py" = ["TID251"]
